name: dbt prod incremental

on:
  schedule:
    - cron: '0 3 * * *'  # Run daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      select:
        description: 'Model(s) to run (e.g. daily_market_stats). Leave blank for all.'
        required: false
        default: ''
      full_refresh:
        description: 'Run with --full-refresh?'
        required: false
        type: boolean
        default: false

concurrency:
  group: dbt-prod-runs  # Shared group with dbt_deploy.yml to prevent concurrent production runs
  cancel-in-progress: false  # Don't cancel in-progress runs, queue instead

jobs:
  dbt-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
      DUNE_TEAM_NAME: ${{ vars.DUNE_TEAM_NAME || 'dune' }}  # Set as GitHub Variable or defaults to 'dune'
      DBT_TARGET: prod  # All dbt commands will use the prod target from profiles.yml

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Install dbt packages
        run: uv run dbt deps

      - name: Run models
        run: |
          FLAGS=""
          if [ -n "${{ github.event.inputs.select }}" ]; then
            FLAGS="$FLAGS --select ${{ github.event.inputs.select }}"
          else
            FLAGS="$FLAGS --exclude config.materialized:view"
          fi
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            FLAGS="$FLAGS --full-refresh"
          fi
          uv run dbt run $FLAGS

      - name: Test models
        run: |
          FLAGS=""
          if [ -n "${{ github.event.inputs.select }}" ]; then
            FLAGS="$FLAGS --select ${{ github.event.inputs.select }}"
          else
            FLAGS="$FLAGS --exclude config.materialized:view"
          fi
          uv run dbt test $FLAGS
